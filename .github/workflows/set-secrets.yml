name: Set Worker Secrets

# Manually triggered from the Actions tab ("Run workflow" button).
# Pushes values from GitHub repo secrets into the deployed Cloudflare
# Worker's secret bindings (wrangler secret put). Re-run any time a value
# changes in repo secrets.

on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Set ADMIN_SECRET
        if: ${{ secrets.ADMIN_SECRET != '' }}
        run: echo "${{ secrets.ADMIN_SECRET }}" | npx wrangler secret put ADMIN_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set STRIPE_SECRET_KEY
        if: ${{ secrets.STRIPE_SECRET_KEY != '' }}
        run: echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler secret put STRIPE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set STRIPE_WEBHOOK_SECRET
        if: ${{ secrets.STRIPE_WEBHOOK_SECRET != '' }}
        run: echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set STRIPE_PUBLISHABLE_KEY
        if: ${{ secrets.STRIPE_PUBLISHABLE_KEY != '' }}
        run: echo "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" | npx wrangler secret put STRIPE_PUBLISHABLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
