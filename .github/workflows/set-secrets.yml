name: Set Worker Secrets

# Manually triggered from the Actions tab ("Run workflow" button).
# Pushes values from GitHub repo secrets into the deployed Cloudflare
# Worker's secret bindings (wrangler secret put). Re-run any time a value
# changes in repo secrets.

on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SECRET_VALUE: ${{ secrets.ADMIN_SECRET }}
      STRIPE_SECRET_KEY_VALUE: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_VALUE: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PUBLISHABLE_KEY_VALUE: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # GitHub Actions doesn't allow referencing the `secrets` context inside
      # an `if:` conditional (the whole workflow fails to even start), so the
      # "only set it if it's present" checks live in bash instead.
      - name: Set secrets
        run: |
          set -e
          if [ -n "$ADMIN_SECRET_VALUE" ]; then
            echo "Setting ADMIN_SECRET"
            echo "$ADMIN_SECRET_VALUE" | npx wrangler secret put ADMIN_SECRET
          fi
          if [ -n "$STRIPE_SECRET_KEY_VALUE" ]; then
            echo "Setting STRIPE_SECRET_KEY"
            echo "$STRIPE_SECRET_KEY_VALUE" | npx wrangler secret put STRIPE_SECRET_KEY
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET_VALUE" ]; then
            echo "Setting STRIPE_WEBHOOK_SECRET"
            echo "$STRIPE_WEBHOOK_SECRET_VALUE" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          fi
          if [ -n "$STRIPE_PUBLISHABLE_KEY_VALUE" ]; then
            echo "Setting STRIPE_PUBLISHABLE_KEY"
            echo "$STRIPE_PUBLISHABLE_KEY_VALUE" | npx wrangler secret put STRIPE_PUBLISHABLE_KEY
          fi
